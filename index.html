<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Granulometría en línea</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* ================= CONFIGURACIÓN DE BANDAS =================
   Para agregar una banda: copia una línea en BANDAS (en el script, abajo)
   con el nombre, el ID de su Google Sheet y su gid. */

:root{
  --bg:#EDF0F0; --surface:#FFFFFF; --ink:#1F2A30; --muted:#5E6B72; --line:#D3D9DB;
  --accent:#F2B705; --ok:#2E8B57; --bad:#C0392B; --warn:#C98404; --none:#B7BEC2;
  --peso:#2F5D7C; --conteo:#8FA8B8;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#172024; --surface:#212B30; --ink:#E6EBED; --muted:#9AA7AE; --line:#34424A;
    --accent:#F2B705; --ok:#4CB17A; --bad:#E0604F; --warn:#E3A62B; --none:#56646B;
    --peso:#7FB3D5; --conteo:#4C6A7D; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#172024; --surface:#212B30; --ink:#E6EBED; --muted:#9AA7AE; --line:#34424A;
  --accent:#F2B705; --ok:#4CB17A; --bad:#E0604F; --warn:#E3A62B; --none:#56646B;
  --peso:#7FB3D5; --conteo:#4C6A7D; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font:400 16px/1.5 "Barlow",system-ui,"Segoe UI",Arial,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:20px 18px 40px}
h1{font:600 1.9rem/1.1 "Barlow Condensed","Arial Narrow",sans-serif;margin:0;letter-spacing:.01em}
.sub{color:var(--muted);margin:4px 0 0;font-size:.95rem}
header{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
select,input[type=date],button{font:inherit;color:var(--ink);background:var(--surface);
  border:1px solid var(--line);border-radius:6px;padding:7px 10px}
button{cursor:pointer}
button:hover{border-color:var(--muted)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.live{display:none;align-items:center;gap:6px;font-weight:600;color:var(--ok)}
.live.on{display:inline-flex}
.live::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--ok)}

/* La banda del día: cada minuto es una marca coloreada según cumplimiento */
.belt{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 16px 10px}
.belt-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.clock{font:700 3rem/1 "Barlow Condensed","Arial Narrow",sans-serif;font-variant-numeric:tabular-nums}
.step{display:flex;gap:6px;align-items:center}
.track{position:relative;height:46px;margin:14px 0 4px}
#strip{position:absolute;inset:8px 0 8px 0;width:100%;height:30px;border-radius:4px;
  background:repeating-linear-gradient(90deg,transparent 0 calc(100%/24 - 1px),var(--line) calc(100%/24 - 1px) calc(100%/24));}
#cursor{position:absolute;top:0;bottom:0;width:4px;margin-left:-2px;background:var(--accent);border-radius:2px;pointer-events:none}
#slider{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:ew-resize}
#slider:focus-visible + #cursor{box-shadow:0 0 0 3px var(--ink)}
.hours{display:flex;justify-content:space-between;color:var(--muted);font-size:.78rem;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:8px;font-size:.85rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:5px;vertical-align:-1px}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:16px}
.cell{background:var(--surface);padding:12px 14px}
.cell .k{color:var(--muted);font-size:.85rem}
.cell .v{font:600 1.7rem/1.15 "Barlow Condensed","Arial Narrow",sans-serif;font-variant-numeric:tabular-nums}
.cell .v small{font-size:.95rem;color:var(--muted);font-weight:500}
.tag{display:inline-block;font-weight:600;font-size:.9rem;padding:1px 8px;border-radius:4px;margin-top:4px;color:#fff}
.t-SI{background:var(--ok)} .t-NO{background:var(--bad)} .t-POCOS{background:var(--warn)} .t-SIN{background:var(--none);color:var(--ink)}
.alert{margin-top:12px;padding:10px 14px;border-left:4px solid var(--warn);background:var(--surface);border-radius:6px}
.alert:empty{display:none}

.charts{display:grid;grid-template-columns:1fr 1.4fr;gap:16px;margin-top:16px}
@media (max-width:820px){.charts{grid-template-columns:1fr}.clock{font-size:2.4rem}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.panel h2{font:600 1.15rem/1.2 "Barlow Condensed","Arial Narrow",sans-serif;margin:0 0 2px}
.panel p{margin:0 0 10px;color:var(--muted);font-size:.88rem}
.chartbox{position:relative;height:280px}
.foto{margin-top:12px;color:var(--muted);font-size:.88rem;overflow-wrap:anywhere}
.empty{margin-top:16px;padding:28px;text-align:center;background:var(--surface);border:1px dashed var(--line);border-radius:10px}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="titulo">Granulometría</h1>
      <p class="sub" id="estado">Cargando datos…</p>
    </div>
    <div class="controls">
      <label class="hidden" for="banda">Banda</label>
      <select id="banda" aria-label="Banda"></select>
      <button id="diaAnt" aria-label="Día anterior">◀</button>
      <input type="date" id="fecha" aria-label="Fecha">
      <button id="diaSig" aria-label="Día siguiente">▶</button>
      <button id="hoy">Hoy</button>
      <span class="live" id="live">En vivo</span>
    </div>
  </header>

  <section class="belt" aria-label="Línea de tiempo del día">
    <div class="belt-head">
      <div class="clock" id="reloj">--:--</div>
      <div class="step">
        <button id="minAnt" aria-label="Minuto anterior con datos">◀ Minuto</button>
        <button id="minSig" aria-label="Minuto siguiente con datos">Minuto ▶</button>
        <button id="ultimo">Último dato</button>
      </div>
    </div>
    <div class="track">
      <canvas id="strip"></canvas>
      <input type="range" id="slider" min="0" max="1439" step="1" value="0" aria-label="Hora del día">
      <div id="cursor"></div>
    </div>
    <div class="hours"><span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>24:00</span></div>
    <div class="legend">
      <span><i style="background:var(--ok)"></i>Cumple</span>
      <span><i style="background:var(--bad)"></i>No cumple</span>
      <span><i style="background:var(--warn)"></i>Pocos datos</span>
      <span><i style="background:var(--none)"></i>Sin material</span>
    </div>
  </section>

  <div id="vacio" class="empty hidden"></div>

  <div id="contenido">
    <div class="grid" id="datos"></div>
    <div class="alert" id="alerta"></div>
    <div class="charts">
      <div class="panel">
        <h2>Curva granulométrica</h2>
        <p>% retenido por malla en el minuto elegido</p>
        <div class="chartbox"><canvas id="curva"></canvas></div>
        <div class="foto" id="foto"></div>
      </div>
      <div class="panel">
        <h2>Cumplimiento del día</h2>
        <p>2" + 3" + 4", mínimo 80 %. La línea amarilla marca el minuto elegido.</p>
        <div class="chartbox"><canvas id="tendencia"></canvas></div>
      </div>
    </div>
  </div>
</div>

<script>
// ================= CONFIGURACIÓN =================
// Una entrada por banda. "id" es la parte del link entre /d/ y /edit; "gid" es el número de la pestaña.
const BANDAS = [
  { nombre: "TB06 Roca", id: "1Os3uvBVx6dqHJ-zVbaPrrD-5I3xOZ_FerzbJ9qaeL7U", gid: "0" },
];
const REFRESCO_SEG = 60;     // cada cuánto se actualiza cuando ves el día de hoy
const META = 80;             // % mínimo de cumplimiento
// =================================================

const MALLAS = [
  ["5in",'5"'],["4in",'4"'],["3in",'3"'],["2in",'2"'],["1_5in",'1½"'],
  ["1in",'1"'],["3_4in",'¾"'],["1_2in",'½"'],["1_4in",'¼"'],["FINOS","Finos"]
];

const $ = id => document.getElementById(id);
let filas = [], idx = -1, timer = null, graf1 = null, graf2 = null;

const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const num = v => { if (v === null || v === undefined || v === "") return null; const n = parseFloat(String(v).replace(",", ".")); return isNaN(n) ? null : n; };
const hoyISO = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const minutoDe = h => { const m = /^(\d{1,2}):(\d{2})/.exec(h || ""); return m ? (+m[1]) * 60 + (+m[2]) : null; };
const estadoClase = s => { s = (s || "").toUpperCase(); return s.startsWith("SI") ? "SI" : s.startsWith("NO") ? "NO" : s.startsWith("POCOS") ? "POCOS" : "SIN"; };
const colorEstado = s => ({ SI: css("--ok"), NO: css("--bad"), POCOS: css("--warn"), SIN: css("--none") })[estadoClase(s)];

// ---------- Lectura desde Google Sheets (solo el día pedido) ----------
// Se pide con una etiqueta <script> (Google llama a nuestra función), así funciona
// igual abriendo el archivo con doble clic que desde un sitio web.
function pedirGoogle(url) {
  return new Promise((resolve, reject) => {
    const cb = "gv_" + Date.now() + "_" + Math.floor(Math.random() * 1e6);
    const s = document.createElement("script");
    const fin = () => { clearTimeout(t); delete window[cb]; s.remove(); };
    const t = setTimeout(() => { fin(); reject(new Error("Google no respondió a tiempo")); }, 20000);
    window[cb] = json => { fin(); resolve(json); };
    s.onerror = () => { fin(); reject(new Error("no se pudo conectar con Google")); };
    s.src = url + "&tqx=" + encodeURIComponent("out:json;responseHandler:" + cb);
    document.head.appendChild(s);
  });
}

async function leerDia(banda, fecha) {
  const tq = encodeURIComponent(`select * where A = '${fecha}'`);
  const url = `https://docs.google.com/spreadsheets/d/${banda.id}/gviz/tq?headers=1&gid=${banda.gid}&tq=${tq}&t=${Date.now()}`;
  const json = await pedirGoogle(url);
  if (json.status === "error") throw new Error(json.errors?.[0]?.detailed_message || "Error en la consulta");
  const cols = json.table.cols.map((c, i) => (c.label || c.id || "c" + i).trim());
  return json.table.rows.map(r => {
    const o = {};
    cols.forEach((c, i) => { const cell = r.c[i]; o[c] = cell ? (cell.f ?? cell.v ?? "") : ""; });
    return o;
  }).filter(o => o.hora).sort((a, b) => minutoDe(a.hora) - minutoDe(b.hora));
}

// ---------- Carga y refresco ----------
async function cargar(mantenerFinal) {
  const banda = BANDAS[$("banda").value];
  const fecha = $("fecha").value;
  const estabaAlFinal = idx === filas.length - 1;
  $("estado").textContent = "Cargando datos…";
  try {
    const nuevas = await leerDia(banda, fecha);
    const horaAntes = filas[idx]?.hora;
    filas = nuevas;
    if (!filas.length) { idx = -1; mostrarVacio(fecha); }
    else {
      $("vacio").classList.add("hidden"); $("contenido").classList.remove("hidden");
      if (mantenerFinal && !estabaAlFinal && horaAntes) idx = Math.max(0, filas.findIndex(f => f.hora === horaAntes));
      else idx = filas.length - 1;
      dibujarTira(); dibujarTendencia(); seleccionar(idx);
    }
    const ahora = new Date().toLocaleTimeString("es-MX", { hour: "2-digit", minute: "2-digit" });
    $("estado").textContent = `${filas.length} minutos con registro · actualizado ${ahora}`;
  } catch (e) {
    $("estado").textContent = "No se pudieron leer los datos: " + e.message + ". Revisa tu conexión y que la hoja esté compartida con cualquier persona con el vínculo.";
  }
  const esHoy = fecha === hoyISO();
  $("live").classList.toggle("on", esHoy);
  clearInterval(timer);
  if (esHoy) timer = setInterval(() => cargar(true), REFRESCO_SEG * 1000);
}

function mostrarVacio(fecha) {
  $("contenido").classList.add("hidden");
  const v = $("vacio"); v.classList.remove("hidden");
  v.textContent = `No hay registros del ${fecha}. Elige otro día con las flechas o el calendario.`;
  $("reloj").textContent = "--:--";
  const c = $("strip"); c.getContext("2d").clearRect(0, 0, c.width, c.height);
  $("cursor").style.left = "0%";
}

// ---------- Tira del día (un trazo por minuto) ----------
function dibujarTira() {
  const c = $("strip"), dpr = window.devicePixelRatio || 1;
  c.width = c.clientWidth * dpr; c.height = c.clientHeight * dpr;
  const g = c.getContext("2d"); g.clearRect(0, 0, c.width, c.height);
  const w = c.width / 1440;
  filas.forEach(f => {
    const m = minutoDe(f.hora); if (m === null) return;
    g.fillStyle = colorEstado(f.cumple);
    g.fillRect(m * w, 0, Math.max(w, 1.5 * dpr), c.height);
  });
}

// ---------- Selección de un minuto ----------
function seleccionar(i) {
  if (!filas.length) return;
  idx = Math.max(0, Math.min(filas.length - 1, i));
  const f = filas[idx], m = minutoDe(f.hora);
  $("slider").value = m;
  $("cursor").style.left = (m / 1440 * 100) + "%";
  $("reloj").textContent = f.hora;

  const tag = s => `<span class="tag t-${estadoClase(s)}">${s || "—"}</span>`;
  const val = (v, u) => num(v) === null ? "—" : `${num(v)}<small> ${u}</small>`;
  $("datos").innerHTML = `
    <div class="cell"><div class="k">Cumplimiento por peso</div><div class="v">${val(f.cumplimiento_peso_est_pct, "%")}</div>${tag(f.cumple_peso_est)}</div>
    <div class="cell"><div class="k">Cumplimiento por conteo</div><div class="v">${val(f.cumplimiento_conteo_pct, "%")}</div>${tag(f.cumple_conteo)}</div>
    <div class="cell"><div class="k">Rocas contadas</div><div class="v">${val(f.rocas_contadas, "")}</div></div>
    <div class="cell"><div class="k">Toneladas por hora</div><div class="v">${val(f.toneladas_hora, "t/h")}</div></div>
    <div class="cell"><div class="k">Largo × ancho promedio</div><div class="v">${num(f.largo_prom_mm) ?? "—"} × ${num(f.ancho_prom_mm) ?? "—"}<small> mm</small></div></div>
    <div class="cell"><div class="k">Cobertura de banda</div><div class="v">${val(f.cobertura_pct, "%")}</div></div>`;
  $("alerta").textContent = f.alerta ? "Alerta: " + f.alerta : "";
  $("foto").textContent = f.foto ? "Foto de este minuto (en la PC de planta): " + f.foto : "";

  dibujarCurva(f);
  if (graf2) graf2.update("none");
}

// ---------- Gráficas ----------
Chart.defaults.font.family = '"Barlow", system-ui, sans-serif';

function dibujarCurva(f) {
  const datos = {
    labels: MALLAS.map(m => m[1]),
    datasets: [
      { label: "% peso estimado", data: MALLAS.map(m => num(f["peso_est_" + m[0]])), backgroundColor: css("--peso") },
      { label: "% conteo", data: MALLAS.map(m => num(f["conteo_" + m[0]])), backgroundColor: css("--conteo") },
    ]
  };
  if (graf1) { graf1.data = datos; graf1.update("none"); return; }
  graf1 = new Chart($("curva"), {
    type: "bar", data: datos,
    options: { responsive: true, maintainAspectRatio: false, animation: false,
      scales: { y: { beginAtZero: true, max: 100, ticks: { color: css("--muted"), callback: v => v + " %" }, grid: { color: css("--line") } },
                x: { ticks: { color: css("--muted") }, grid: { display: false } } },
      plugins: { legend: { labels: { color: css("--ink") } },
                 tooltip: { callbacks: { label: c => `${c.dataset.label}: ${c.parsed.y ?? "—"} %` } } } }
  });
}

const lineas = {
  id: "lineas",
  afterDatasetsDraw(ch) {
    const { ctx, chartArea: a, scales: { x, y } } = ch;
    ctx.save();
    const ym = y.getPixelForValue(META);
    ctx.strokeStyle = css("--muted"); ctx.setLineDash([5, 4]); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(a.left, ym); ctx.lineTo(a.right, ym); ctx.stroke();
    ctx.setLineDash([]);
    if (idx >= 0) {
      const xp = x.getPixelForValue(idx);
      ctx.strokeStyle = css("--accent"); ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(xp, a.top); ctx.lineTo(xp, a.bottom); ctx.stroke();
    }
    ctx.restore();
  }
};

function dibujarTendencia() {
  const datos = {
    labels: filas.map(f => f.hora),
    datasets: [
      { label: "% por peso", data: filas.map(f => num(f.cumplimiento_peso_est_pct)), borderColor: css("--peso"), backgroundColor: css("--peso"), pointRadius: 0, borderWidth: 2, spanGaps: false },
      { label: "% por conteo", data: filas.map(f => num(f.cumplimiento_conteo_pct)), borderColor: css("--conteo"), backgroundColor: css("--conteo"), pointRadius: 0, borderWidth: 2, spanGaps: false },
    ]
  };
  if (graf2) { graf2.data = datos; graf2.update("none"); return; }
  graf2 = new Chart($("tendencia"), {
    type: "line", data: datos, plugins: [lineas],
    options: { responsive: true, maintainAspectRatio: false, animation: false,
      interaction: { mode: "index", intersect: false },
      onClick: (e, els) => { if (els.length) seleccionar(els[0].index); },
      scales: { y: { min: 0, max: 100, ticks: { color: css("--muted"), callback: v => v + " %" }, grid: { color: css("--line") } },
                x: { ticks: { color: css("--muted"), maxTicksLimit: 12, maxRotation: 0 }, grid: { display: false } } },
      plugins: { legend: { labels: { color: css("--ink") } } } }
  });
}

// ---------- Controles ----------
function moverDia(d) {
  const f = new Date($("fecha").value + "T12:00:00"); f.setDate(f.getDate() + d);
  $("fecha").value = f.toISOString().slice(0, 10); idx = -1; cargar(false);
}
function cercano(minuto) {
  let mejor = 0, dist = Infinity;
  filas.forEach((f, i) => { const d = Math.abs(minutoDe(f.hora) - minuto); if (d < dist) { dist = d; mejor = i; } });
  return mejor;
}

BANDAS.forEach((b, i) => $("banda").add(new Option(b.nombre, i)));
if (BANDAS.length < 2) $("banda").classList.add("hidden");
$("titulo").textContent = "Granulometría " + BANDAS[0].nombre;
$("banda").onchange = () => { $("titulo").textContent = "Granulometría " + BANDAS[$("banda").value].nombre; idx = -1; cargar(false); };
$("fecha").value = hoyISO();
$("fecha").max = hoyISO();
$("fecha").onchange = () => { idx = -1; cargar(false); };
$("diaAnt").onclick = () => moverDia(-1);
$("diaSig").onclick = () => moverDia(1);
$("hoy").onclick = () => { $("fecha").value = hoyISO(); idx = -1; cargar(false); };
$("minAnt").onclick = () => seleccionar(idx - 1);
$("minSig").onclick = () => seleccionar(idx + 1);
$("ultimo").onclick = () => seleccionar(filas.length - 1);
$("slider").addEventListener("input", e => { if (filas.length) seleccionar(cercano(+e.target.value)); });
$("slider").addEventListener("keydown", e => {
  if (e.key === "ArrowLeft" || e.key === "ArrowDown") { e.preventDefault(); seleccionar(idx - 1); }
  if (e.key === "ArrowRight" || e.key === "ArrowUp") { e.preventDefault(); seleccionar(idx + 1); }
});
window.addEventListener("resize", () => { if (filas.length) dibujarTira(); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
  if (graf1) { graf1.destroy(); graf1 = null; } if (graf2) { graf2.destroy(); graf2 = null; }
  if (filas.length) { dibujarTira(); dibujarTendencia(); seleccionar(idx); }
});

cargar(false);
</script>
</body>
</html>
